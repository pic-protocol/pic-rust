name: Publish to crates.io

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Extract Version from Tag
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Bump version in Cargo.toml
      run: |
        # Unica riga version = "..." è in [workspace.package]
        sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml

    - name: Debug - Verify versions
      run: |
        echo "=== Expected: ${VERSION} ==="
        grep -E "^version" Cargo.toml || true
        grep -E "^version" crates/pic-continuity/Cargo.toml || true

    - name: Build workspace
      run: cargo build --release --workspace

    - name: Run tests
      run: cargo test --workspace

    - name: Publish pic-continuity
      run: cargo publish -p pic-continuity --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

    - name: Wait for crates.io
      run: sleep 30

    - name: Update root dependencies
      run: sed -i "s|pic-continuity = { path = \"crates/pic-continuity\" }|pic-continuity = \"${VERSION}\"|" Cargo.toml

    - name: Publish pic-protocol
      run: cargo publish --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}